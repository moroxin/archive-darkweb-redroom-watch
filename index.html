<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RED ROOM</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;
    background:#050505;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

/* TITLE */

.title{
    text-align:center;
    padding:25px 10px 18px;

    font-family:Georgia,serif;
    font-size:clamp(42px,13vw,90px);
    font-weight:900;
    letter-spacing:5px;

    color:#8b0000;

    text-shadow:
        0 2px 0 #300000,
        0 5px 12px #000,
        0 0 25px rgba(120,0,0,.5);
}

/* MAIN */

.container{
    width:min(720px,94%);
    margin:auto;
}

/* VIDEO */

.video{
    position:relative;
    width:100%;
    aspect-ratio:16/10;

    overflow:hidden;
    background:#151010;
    border:1px solid #321010;
    box-shadow:0 15px 50px #000;
}

/* BLURRED SCENE */

.scene{
    position:absolute;
    inset:-40px;

    filter:blur(25px);
    transform:scale(1.12);

    background:
        radial-gradient(
            ellipse at 35% 48%,
            #765d58 0 12%,
            transparent 13%
        ),
        radial-gradient(
            ellipse at 65% 48%,
            #69524e 0 13%,
            transparent 14%
        ),
        linear-gradient(
            160deg,
            #241b1b,
            #56433f 42%,
            #211818 65%,
            #070707
        );
}

/* BED */

.scene:before{
    content:"";

    position:absolute;
    left:5%;
    right:5%;
    bottom:0;

    height:48%;

    border-radius:50% 50% 5% 5%;

    background:
        linear-gradient(
            160deg,
            #62504d,
            #292120 70%,
            #111
        );
}

/* TWO BLURRED FIGURES */

.scene:after{
    content:"";

    position:absolute;

    width:70%;
    height:45%;

    left:15%;
    top:22%;

    border-radius:50%;

    background:
        radial-gradient(
            ellipse at 28% 50%,
            #806966 0 13%,
            transparent 14%
        ),
        radial-gradient(
            ellipse at 72% 48%,
            #77605c 0 13%,
            transparent 14%
        ),
        rgba(30,22,22,.7);
}

/* DARK OVERLAY */

.video::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.35),
            transparent 45%,
            rgba(0,0,0,.75)
        );
}

/* SIMPLE PLAYER */

.player{
    position:absolute;

    z-index:5;

    left:0;
    right:0;
    bottom:0;

    height:55px;

    padding:0 15px;

    display:flex;
    align-items:center;
    gap:12px;

    background:linear-gradient(
        transparent,
        rgba(0,0,0,.9)
    );
}

.play{
    font-size:17px;
}

.time{
    font-size:10px;
    color:#aaa;
}

.line{
    flex:1;
    height:3px;
    background:#444;
    overflow:hidden;
}

.line div{
    width:0%;
    height:100%;
    background:#aaa;

    transition:width .2s linear;
}

/* LOADING */

.loading{
    position:absolute;

    z-index:10;

    inset:0;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.55);

    backdrop-filter:blur(4px);
}

.loading-text{
    font-size:11px;
    letter-spacing:3px;
    color:#ddd;
}

.loading-small{
    margin-top:10px;
    font-size:9px;
    letter-spacing:2px;
    color:#777;
}

/* BUTTON */

.start{
    display:block;

    width:100%;

    margin-top:15px;

    padding:16px;

    border:1px solid #3b1111;

    background:#100707;

    color:#aaa;

    letter-spacing:3px;
    font-size:10px;

    cursor:pointer;
}

.start:active{
    transform:scale(.99);
}

/* FLASH */

.flash{
    position:fixed;
    inset:0;

    z-index:50;

    background:white;

    opacity:0;
    pointer-events:none;
}

.flash.active{
    animation:flash .35s;
}

@keyframes flash{
    0%{opacity:0}
    12%{opacity:.95}
    100%{opacity:0}
}

/* END */

.end{
    position:fixed;
    inset:0;

    z-index:60;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#000;

    opacity:0;
    pointer-events:none;
}

.end.show{
    animation:endScreen 2.5s forwards;
}

.end-text{
    color:#8b0000;
    font-family:Georgia,serif;
    font-size:24px;
    letter-spacing:6px;
}

@keyframes endScreen{
    0%{opacity:0}
    15%{opacity:1}
    75%{opacity:1}
    100%{opacity:0}
}
</style>
</head>

<body>

<div class="title">
    RED ROOM
</div>

<div class="container">

    <div class="video">

        <div class="scene"></div>

        <div class="loading" id="loading">
            <div class="loading-text">
                LOADING VIDEO
            </div>

            <div class="loading-small" id="loadingText">
                BUFFERING...
            </div>
        </div>

        <div class="player">

            <div class="play">▶</div>

            <div class="time">
                00:00
            </div>

            <div class="line">
                <div id="progress"></div>
            </div>

            <div class="time">
                04:17
            </div>

        </div>

    </div>

    <button class="start" id="start">
        WATCH VIDEO
    </button>

</div>

<div class="flash" id="flash"></div>

<div class="end" id="end">
    <div class="end-text">
        RED ROOM
    </div>
</div>

<!-- YOUR SCREAM -->

<audio id="audio" preload="auto">
    <source src="audio.mp3" type="audio/mpeg">
</audio>


<script>

const start = document.getElementById("start");
const loading = document.getElementById("loading");
const loadingText = document.getElementById("loadingText");
const progress = document.getElementById("progress");

const audio = document.getElementById("audio");
const flash = document.getElementById("flash");
const end = document.getElementById("end");

let started = false;

start.addEventListener("click", function(){

    if(started) return;

    started = true;

    start.style.display = "none";

    loading.style.display = "flex";

    let value = 0;

    const timer = setInterval(function(){

        value += Math.floor(Math.random() * 7) + 4;

        if(value >= 100){
            value = 100;
        }

        progress.style.width = value + "%";

        if(value > 30){
            loadingText.textContent = "BUFFERING...";
        }

        if(value > 65){
            loadingText.textContent = "LOADING SOURCE...";
        }

        if(value >= 100){

            clearInterval(timer);

            loadingText.textContent = "PLAYING...";

            setTimeout(function(){

                loading.style.display = "none";

                /* PLAY SCREAM */

                audio.currentTime = 0;
                audio.volume = 1;

                audio.play().catch(function(){
                    /* Browser may block playback */
                });

                /* FLASH */

                flash.classList.remove("active");

                void flash.offsetWidth;

                flash.classList.add("active");

                /* END */

                end.classList.remove("show");

                void end.offsetWidth;

                end.classList.add("show");

            },300);
        }

    },120);

});

</script>

</body>
</html>
