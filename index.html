<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THE ROOM</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
}

body{
    user-select:none;
}

.game{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 45%,
        #303030 0%,
        #151515 35%,
        #050505 78%);
}

/* subtle atmosphere */
.game::before{
    content:"";
    position:absolute;
    inset:-30%;
    background:
        radial-gradient(circle at 50% 50%,
        rgba(255,255,255,.08),
        transparent 35%);
    animation:breath 6s infinite alternate ease-in-out;
}

@keyframes breath{
    from{transform:scale(1)}
    to{transform:scale(1.15)}
}

/* top HUD */
.top{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:5;
    padding:18px;
    display:flex;
    justify-content:space-between;
    font-size:11px;
    letter-spacing:2px;
    color:#777;
}

/* intro */
.intro{
    position:absolute;
    inset:0;
    z-index:10;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:30px;
    background:#050505;
    transition:opacity 1s;
}

.intro.hide{
    opacity:0;
    pointer-events:none;
}

.intro h1{
    margin:0;
    font-size:27px;
    letter-spacing:7px;
    font-weight:400;
}

.intro p{
    margin:18px 0 30px;
    color:#777;
    font-size:12px;
    letter-spacing:2px;
}

.start{
    padding:14px 28px;
    border:1px solid #555;
    background:transparent;
    color:#ddd;
    letter-spacing:3px;
    font-size:11px;
    cursor:pointer;
}

.start:active{
    transform:scale(.96);
}

/* main room */
.room{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* floor */
.floor{
    position:absolute;
    bottom:-10%;
    width:120%;
    height:45%;
    background:
        linear-gradient(
            165deg,
            transparent 0%,
            rgba(255,255,255,.035) 49%,
            transparent 50%
        );
    transform:perspective(500px) rotateX(55deg);
}

/* door */
.door{
    position:relative;
    width:min(68vw,300px);
    height:min(62vh,460px);
    min-height:330px;
    background:
        linear-gradient(90deg,
        #0c0c0c,
        #242424 48%,
        #090909);
    border:7px solid #111;
    box-shadow:
        0 0 0 2px #333,
        0 25px 80px rgba(0,0,0,.9),
        inset 0 0 50px #000;
    cursor:pointer;
    transition:.2s;
}

.door:hover{
    transform:scale(1.015);
}

.door:active{
    transform:scale(.98);
}

/* door panels */
.panel{
    position:absolute;
    left:14%;
    right:14%;
    border:2px solid #080808;
    box-shadow:inset 0 0 20px #000;
}

.panel.one{
    top:9%;
    height:30%;
}

.panel.two{
    bottom:9%;
    height:30%;
}

/* handle */
.handle{
    position:absolute;
    right:8%;
    top:50%;
    width:20px;
    height:20px;
    border-radius:50%;
    background:#888;
    box-shadow:
        0 0 6px #aaa,
        inset 2px 2px 4px #222;
}

/* instructions */
.instruction{
    position:absolute;
    bottom:55px;
    left:0;
    right:0;
    text-align:center;
    z-index:5;
}

.instruction strong{
    display:block;
    font-size:14px;
    letter-spacing:4px;
    font-weight:400;
    animation:pulse 2s infinite;
}

.instruction span{
    display:block;
    margin-top:9px;
    font-size:10px;
    color:#666;
    letter-spacing:2px;
}

@keyframes pulse{
    0%,100%{opacity:.35}
    50%{opacity:1}
}

/* fake loading screen */
.loading{
    position:fixed;
    inset:0;
    z-index:20;
    background:#050505;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s;
}

.loading.show{
    opacity:1;
    pointer-events:auto;
}

.loading-text{
    font-size:11px;
    letter-spacing:3px;
    color:#aaa;
}

.bar{
    width:180px;
    height:2px;
    background:#222;
    margin-top:18px;
    overflow:hidden;
}

.bar div{
    height:100%;
    width:0;
    background:#aaa;
}

/* scream flash */
.flash{
    position:fixed;
    inset:0;
    z-index:50;
    background:white;
    opacity:0;
    pointer-events:none;
}

.flash.active{
    animation:flash .5s;
}

@keyframes flash{
    0%{opacity:0}
    12%{opacity:1}
    100%{opacity:0}
}

/* final message */
.final{
    position:fixed;
    inset:0;
    z-index:60;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:rgba(0,0,0,.85);
    opacity:0;
    pointer-events:none;
}

.final.show{
    animation:finalShow 2s forwards;
}

.final h2{
    font-size:14px;
    letter-spacing:5px;
    font-weight:400;
}

@keyframes finalShow{
    0%{opacity:0}
    15%{opacity:1}
    70%{opacity:1}
    100%{opacity:0}
}

/* bottom */
.bottom{
    position:absolute;
    bottom:15px;
    left:18px;
    right:18px;
    z-index:5;
    display:flex;
    justify-content:space-between;
    color:#444;
    font-size:9px;
    letter-spacing:1.5px;
}
</style>
</head>

<body>

<div class="game">

    <div class="top">
        <span>UNKNOWN ROOM</span>
        <span>STATUS: NORMAL</span>
    </div>

    <!-- INTRO -->
    <div class="intro" id="intro">

        <h1>THE ROOM</h1>

        <p>
            Something is wrong with this place.
        </p>

        <button class="start" id="start">
            ENTER
        </button>

    </div>

    <!-- ROOM -->
    <div class="room">

        <div class="floor"></div>

        <div
            class="door"
            id="door"
            role="button"
            tabindex="0"
        >

            <div class="panel one"></div>
            <div class="panel two"></div>

            <div class="handle"></div>

        </div>

    </div>

    <div class="instruction">
        <strong>FIND THE EXIT</strong>
        <span>There is only one door.</span>
    </div>

    <div class="bottom">
        <span>OBJECTIVE: ESCAPE</span>
        <span>03:17 AM</span>
    </div>

</div>


<!-- FAKE LOADING -->
<div class="loading" id="loading">

    <div class="loading-text">
        OPENING DOOR...
    </div>

    <div class="bar">
        <div id="bar"></div>
    </div>

</div>


<!-- FLASH -->
<div class="flash" id="flash"></div>


<!-- FINAL MESSAGE -->
<div class="final" id="final">

    <h2>
        YOU SHOULDN'T HAVE OPENED IT
    </h2>

</div>


<!-- YOUR WORKING AUDIO -->
<audio id="scream" preload="auto">
    <source src="audio.mp3" type="audio/mpeg">
</audio>


<script>

const intro = document.getElementById("intro");
const start = document.getElementById("start");
const door = document.getElementById("door");

const loading = document.getElementById("loading");
const bar = document.getElementById("bar");

const scream = document.getElementById("scream");
const flash = document.getElementById("flash");
const finalMessage = document.getElementById("final");

let started = false;
let triggered = false;


/* ENTER GAME */

start.addEventListener("click", function(){

    if(started) return;

    started = true;

    intro.classList.add("hide");

});


/* OPEN DOOR */

function openDoor(){

    if(!started || triggered) return;

    triggered = true;

    /* fake loading */
    loading.classList.add("show");

    let progress = 0;

    const timer = setInterval(function(){

        progress += 4;

        bar.style.width = progress + "%";

        if(progress >= 100){

            clearInterval(timer);

            setTimeout(function(){

                /* PLAY SCREAM */

                scream.currentTime = 0;
                scream.volume = 1;

                scream.play().catch(function(){

                    triggered = false;

                });


                /* FLASH */

                flash.classList.remove("active");

                void flash.offsetWidth;

                flash.classList.add("active");


                /* MESSAGE */

                loading.classList.remove("show");

                finalMessage.classList.remove("show");

                void finalMessage.offsetWidth;

                finalMessage.classList.add("show");


            },300);

        }

    },35);

}


/* CLICK */

door.addEventListener("click", openDoor);


/* KEYBOARD */

door.addEventListener("keydown", function(e){

    if(e.key === "Enter" || e.key === " "){

        e.preventDefault();

        openDoor();

    }

});

</script>

</body>
</html>
