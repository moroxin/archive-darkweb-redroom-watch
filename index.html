<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photo</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

.page{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#111;
}

.photo{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

/* Small realistic-looking UI */
.top{
    position:absolute;
    top:0;
    left:0;
    right:0;
    padding:16px;
    display:flex;
    justify-content:space-between;
    color:white;
    font-size:14px;
    opacity:.75;
    pointer-events:none;
}

.bottom{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    padding:18px;
    display:flex;
    justify-content:space-between;
    color:white;
    font-size:13px;
    opacity:.65;
    pointer-events:none;
}

.fade{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.25),
        transparent 20%,
        transparent 80%,
        rgba(0,0,0,.3)
    );
    pointer-events:none;
}
</style>
</head>

<body>

<div class="page">

    <img class="photo" src="images.jpeg" alt="Photo">

    <div class="fade"></div>

    <div class="top">
        <span>Photo</span>
        <span>•••</span>
    </div>

    <div class="bottom">
        <span>View</span>
        <span>♡</span>
    </div>

</div>

<audio id="scream" autoplay preload="auto">
    <source src="scream.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("scream");

audio.volume = 1.0;

window.addEventListener("load", () => {
    audio.play().catch(() => {
        // Browser blocked autoplay.
        // This cannot be bypassed by normal webpage JavaScript.
    });
});
</script>

</body>
</html>
