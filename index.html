<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photo</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

.container {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.photo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.18),
            transparent 25%,
            transparent 75%,
            rgba(0,0,0,.22)
        );
}

.top {
    position: absolute;
    top: 15px;
    left: 16px;
    right: 16px;
    display: flex;
    justify-content: space-between;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 14px;
    opacity: .75;
    pointer-events: none;
}

.bottom {
    position: absolute;
    bottom: 16px;
    left: 16px;
    right: 16px;
    display: flex;
    justify-content: space-between;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 14px;
    opacity: .7;
    pointer-events: none;
}
</style>
</head>

<body>

<div class="container">

    <img
        class="photo"
        src="images.jpeg"
        alt=""
    >

    <div class="overlay"></div>

    <div class="top">
        <span>Photo</span>
        <span>•••</span>
    </div>

    <div class="bottom">
        <span>View</span>
        <span>♡</span>
    </div>

</div>

<audio id="scream" preload="auto">
    <source src="audio.mp3" type="audio/mpeg">
    <source src="audio.wav" type="audio/wav">
    <source src="audio.ogg" type="audio/ogg">
</audio>

<script>
const scream = document.getElementById("scream");

scream.volume = 1.0;

window.addEventListener("load", function () {
    scream.play().catch(function () {
        console.log("Autoplay blocked by browser");
    });
});
</script>

</body>
</html>
